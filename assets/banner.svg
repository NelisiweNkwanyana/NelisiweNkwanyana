<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="g" cx="50%" cy="100%" r="70%">
      <stop offset="0" stop-color="#0087a0" stop-opacity=".35"/>
      <stop offset="1" stop-color="#05070f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" x2="1">
      <stop offset="0" stop-color="#0087a0" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffd83d"/>
      <stop offset="1" stop-color="#0087a0" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .orbit{fill:none;stroke:url(#arc);stroke-width:3;stroke-dasharray:1400;animation:draw 2.4s ease-out backwards}
      .dot{fill:#ffd83d;filter:url(#glow);animation:pulse 2.4s ease-in-out infinite}
      .name{font:800 54px 'Courier New',monospace;fill:#eef3f4;letter-spacing:6px;animation:fade 1s .9s backwards}
      .sub{font:700 14px 'Courier New',monospace;fill:#ffd83d;letter-spacing:5px;animation:fade 1s 1.4s backwards}
      .loc{font:600 11px 'Courier New',monospace;fill:#5fc3d4;letter-spacing:3px}
      .grid{stroke:#0087a0;stroke-opacity:.12}
      @keyframes draw{from{stroke-dashoffset:1400}}
      @keyframes fade{from{opacity:0}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>
  <rect width="1000" height="360" fill="#05070f"/>
  <g class="grid">
    <path d="M0 60H1000M0 120H1000M0 180H1000M0 240H1000M0 300H1000M100 0V360M200 0V360M300 0V360M400 0V360M500 0V360M600 0V360M700 0V360M800 0V360M900 0V360"/>
  </g>
  <rect width="1000" height="360" fill="url(#g)"/>
  <path class="orbit" d="M90 360 A410 95 0 0 1 910 360"/>
  <path class="orbit" style="animation-delay:.3s;stroke-width:1.5" d="M30 380 A470 130 0 0 1 970 380"/>
  <circle class="dot" cx="500" cy="265" r="5"/>
  <circle class="dot" style="animation-delay:.8s" cx="150" cy="318" r="3.5"/>
  <circle class="dot" style="animation-delay:1.6s" cx="850" cy="318" r="3.5"/>
  <text class="name" x="500" y="185" text-anchor="middle">NELISIWE NKWANYANA</text>
  <text class="sub" x="500" y="222" text-anchor="middle">SOFTWARE  /  DATA ENGINEERING  /  FULL-STACK</text>
  <text class="loc" x="30" y="340">● PRETORIA, SOUTH AFRICA</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
